<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Install FixRwanda</title>
  <meta name="theme-color" content="#0052B4">
  <style>
    :root {
      --blue: #0052B4;
      --yellow: #FAD201;
      --bg: #F8FAFC;
    }
    body {
      margin: 0;
      font-family: Segoe UI, system-ui, sans-serif;
      background: var(--bg);
      color: #111827;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 16px 40px rgba(0, 82, 180, 0.12);
    }
    .mark {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--yellow);
      display: grid;
      place-items: center;
      font-size: 28px;
    }
    h1 { margin: 20px 0 8px; font-size: 28px; }
    p { color: #4B5563; line-height: 1.5; }
    .btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      border-radius: 14px;
      padding: 16px;
      margin-top: 20px;
    }
    .btn.secondary {
      background: #fff;
      color: var(--blue);
      border: 2px solid var(--blue);
      margin-top: 12px;
    }
    ol { padding-left: 20px; color: #4B5563; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="mark">🔧</div>
      <h1>Install FixRwanda</h1>
      <p>Kigali marketplace for verified professionals. Use this page on an Android phone.</p>
      <a class="btn" href="https://github.com/Gasasira250/FixRwanda-mobile_app/releases/latest/download/FixRwanda.apk">
        Download and install
      </a>
      <a class="btn secondary" href="./">Open in the browser</a>
      <p><strong>On Android</strong></p>
      <ol>
        <li>Tap Download and install.</li>
        <li>Allow Chrome to install unknown apps if asked.</li>
        <li>Open the FixRwanda file to install.</li>
      </ol>
    </div>
  </div>
</body>
</html>
